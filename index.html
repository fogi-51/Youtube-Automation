<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Polyfill/enable setter on window.fetch for iframe extensions (e.g. frame_ant)
      (function() {
        try {
          var _origFetch = window.fetch;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          try {
            window.fetch = window.fetch;
          } catch (e2) {}
        }

        // Intercept and prevent extension-level setter errors from bubbling
        window.addEventListener('error', function(event) {
          if (
            event.message &&
            (event.message.indexOf('Cannot set property fetch') !== -1 ||
             event.message.indexOf('has only a getter') !== -1)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
